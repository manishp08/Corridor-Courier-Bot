          inflation_radius: 1.2
          cost_scaling_factor: 1.5
          persistence: 0.5
          min_hits: 1
          association_gate: 0.6
        cart:
          enabled: true
          inflation_radius: 0.55
          cost_scaling_factor: 3.0
          persistence: 5.0
          min_hits: 2
          association_gate: 0.4
        low_obstacle:
          enabled: true
          inflation_radius: 0.55
          cost_scaling_factor: 3.0
          persistence: 10.0
          min_hits: 2
          association_gate: 0.4
        glass:
          enabled: true
          inflation_radius: 0.55
          cost_scaling_factor: 3.0
          persistence: 20.0
