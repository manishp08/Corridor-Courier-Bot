# AMCL on the slam_toolbox map. Mirrors sim/ccsim/localization.py AmclParams.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.12
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.95
    z_rand: 0.05
    z_max: 0.0
    z_short: 0.0
    min_particles: 500
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.25
    update_min_a: 0.2
    # Random-particle injection is off (Nav2 default). In a 30 m corridor the
    # along-axis position is unobservable and injected particles hijack the
    # estimate. Kidnapping is detected by localization_monitor instead, which
    # calls /reinitialize_global_localization.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    set_initial_pose: true
    always_reset_initial_pose: false
    transform_tolerance: 0.5
    tf_broadcast: true
    save_pose_rate: 0.5
