[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsim"
version = "0.1.0"
description = "2D surrogate simulator for the CorridorCourier ablation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pillow"]

[tool.setuptools]
packages = ["ccsim"]

[tool.pytest.ini_options]
markers = ["slow: runs full navigation episodes"]
